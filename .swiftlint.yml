# SwiftLint Configuration for noema
# https://github.com/realm/SwiftLint

# Paths to exclude from linting
excluded:
  - Carthage
  - Pods
  - .build
  - DerivedData
  - .swiftpm
  - Tests/LinuxMain.swift
  - fastlane
  - Scripts

# Paths to include (optional, defaults to all Swift files)
included:
  - noema-ios/Sources
  - noema-ios/Tests

# Analyzer rules (require compiling)
analyzer_rules:
  - unused_declaration
  - unused_import

# Opt-in rules (not enabled by default)
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - unused_declaration
  - unused_import
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Disabled rules
disabled_rules:
  - todo # Allow TODO comments for now
  - line_length # Handled separately
  - function_body_length # Allow longer functions in some cases

# Rule configurations
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

function_parameter_count:
  warning: 6
  error: 8

type_body_length:
  warning: 300
  error: 500

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - T
    - U
    - V

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - db

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 5

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: '(print\(|NSLog\()'
    match_kinds:
      - identifier
    message: "Use proper logging instead of print()"
    severity: warning

  no_force_cast:
    name: "No Force Cast"
    regex: 'as!'
    message: "Avoid force casting, use optional binding or guard"
    severity: error

  no_force_unwrap:
    name: "No Force Unwrap"
    regex: '!\s*(?!nil\s*&&)'
    message: "Avoid force unwrapping, use optional binding or guard"
    severity: warning

# Reporter type
reporter: "xcode" # Options: xcode, json, csv, checkstyle, junit, html, emoji, sonarqube

# SwiftLint version
swiftlint_version: 0.54.0
